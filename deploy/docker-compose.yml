# Pharos: one installation = one organization on one Linux host.
#
#   make env      create deploy/.env with generated passwords
#   make dev      build and start everything, then open https://localhost
#
# Networks
#   edge    the only network with published ports (caddy)
#   app     no route to the internet (internal: true): caddy, web and api. The part of the stack
#           that faces users and renders their requests.
#   data    no route to the internet (internal: true): api, worker, beat, migrate, postgres, redis.
#           caddy and web are not on it, so a compromised proxy or web app cannot open a
#           connection to the database or to Redis.
#   egress  outbound internet for the services that must call out: api (identity provider) and
#           worker (content sources and LLM providers). beat only needs Redis, so it is not on it.
# postgres, redis and web cannot open connections to the internet.
# Which destinations the egress services may reach is a host firewall or proxy decision; see
# docs/DEPLOYMENT.md.
#
# The profiles "dev" (Keycloak), "local-llm" (Ollama) and "observability" (OpenTelemetry,
# Prometheus, Grafana) are reserved. Their services arrive with the milestones that need them
# (M2, M4, M5), together with the decision about which images to trust.

name: pharos

networks:
  edge: {}
  app:
    internal: true
    # Pinned, so the API can trust forwarded headers from Caddy's address only (see PHAROS_CADDY_IP).
    # Change both when the range clashes with a network on the host. Caddy takes a high address of the
    # range, outside ip_range: Docker hands out dynamic addresses only from ip_range, so no other
    # container can ever take it.
    ipam:
      config:
        - subnet: ${PHAROS_APP_SUBNET:-172.28.20.0/24}
          ip_range: ${PHAROS_APP_DYNAMIC_RANGE:-172.28.20.0/25}
  data:
    internal: true
  egress: {}
  # The local model (profile "local-llm", ADR-0020): the worker reaches it here and nothing else
  # does. The network has no gateway to the internet, so the server has no route out of its own.
  # (A service on the host that listens on all interfaces can still be reached through the
  # network's gateway address, as for the other internal networks; see docs/DEPLOYMENT.md.)
  # The server has a fixed address, which the worker uses instead of a name: a name could resolve
  # elsewhere through a search domain or a proxy. Change the range if it clashes with a network on
  # the host, and PHAROS_OLLAMA_IP with it.
  llm:
    internal: true
    ipam:
      config:
        - subnet: ${PHAROS_OLLAMA_SUBNET:-172.28.30.0/24}
  # Only for the one-shot model download (profile "local-llm-pull"): its own network, so the job
  # shares nothing with the API or the worker while it has a route to the internet.
  pull: {}

volumes:
  ollama_models: {}
  postgres_data: {}
  redis_data: {}
  caddy_data: {}
  caddy_config: {}

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  # Container logs rotate by size, so that no service can fill the disk (Docker keeps them for
  # ever by default). The size is a bound, not a number of days: how long a line is kept
  # depends on how much a service writes (docs/DEPLOYMENT.md, "Retention").
  logging:
    driver: json-file
    options:
      max-size: ${PHAROS_LOG_MAX_SIZE:-10m}
      max-file: "${PHAROS_LOG_MAX_FILE:-5}"

x-backend-build: &backend-build
  context: ..
  dockerfile: backend/Dockerfile

# What the worker and the scheduler get. They will handle content from outside, so they must not
# hold anything that signs a person in: no root key, no identity-provider secret, no sign-in mode.
# (Their database role and Redis user are limited to what ingestion needs: ADR-0012, F-14.)
x-worker-env: &worker-env
  PHAROS_PROCESS: worker
  PHAROS_ENVIRONMENT: ${PHAROS_ENVIRONMENT:-production}
  PHAROS_LOG_LEVEL: ${PHAROS_LOG_LEVEL:-INFO}
  # The worker's own database role: it gets grants on the ingestion tables only (ADR-0012).
  PHAROS_DATABASE_URL: postgresql+asyncpg://pharos_worker:${PHAROS_WORKER_DB_PASSWORD:?set PHAROS_WORKER_DB_PASSWORD}@postgres:5432/pharos
  # The worker's own Redis user: it sees the Celery queue and pharos:worker:* only (deploy/redis/start.sh).
  PHAROS_REDIS_URL: redis://pharos_worker:${PHAROS_REDIS_WORKER_PASSWORD:?set PHAROS_REDIS_WORKER_PASSWORD}@redis:6379/0
  PHAROS_PUBLIC_URL: ${PHAROS_PUBLIC_URL:?set PHAROS_PUBLIC_URL}
  # Where the local model server is (provider "ollama"); must match the llm network's range.
  PHAROS_OLLAMA_IP: ${PHAROS_OLLAMA_IP:-172.28.30.10}
  PHAROS_ORG_SLUG: ${PHAROS_ORG_SLUG:-default}
  PHAROS_PERSONAL_FEEDS: ${PHAROS_PERSONAL_FEEDS:-on}
  PHAROS_LLM_PROVIDER: ${PHAROS_LLM_PROVIDER:-off}
  PHAROS_LLM_BASE_URL: ${PHAROS_LLM_BASE_URL:-}
  PHAROS_LLM_MODEL_FILTER: ${PHAROS_LLM_MODEL_FILTER:-}
  PHAROS_LLM_MODEL_ENRICHMENT: ${PHAROS_LLM_MODEL_ENRICHMENT:-}
  PHAROS_LLM_MODEL_INSIGHT: ${PHAROS_LLM_MODEL_INSIGHT:-}
  PHAROS_LLM_DAILY_BUDGET_MICRO_USD: ${PHAROS_LLM_DAILY_BUDGET_MICRO_USD:-2000000}
  PHAROS_LLM_PRICE_IN_MICRO_USD: ${PHAROS_LLM_PRICE_IN_MICRO_USD:-20}
  PHAROS_LLM_PRICE_OUT_MICRO_USD: ${PHAROS_LLM_PRICE_OUT_MICRO_USD:-100}
  PHAROS_LLM_CALLS_PER_MINUTE: ${PHAROS_LLM_CALLS_PER_MINUTE:-30}
  PHAROS_LLM_ENRICH_BATCH: ${PHAROS_LLM_ENRICH_BATCH:-20}
  PHAROS_LLM_TIMEOUT_SECONDS: ${PHAROS_LLM_TIMEOUT_SECONDS:-60}
  PHAROS_LLM_MAX_RETRIES: ${PHAROS_LLM_MAX_RETRIES:-2}
  # Embeddings and clusters of near-duplicates (ADR-0007, ADR-0021). Off unless a provider is named.
  PHAROS_EMBEDDING_PROVIDER: ${PHAROS_EMBEDDING_PROVIDER:-off}
  PHAROS_EMBEDDING_MODEL: ${PHAROS_EMBEDDING_MODEL:-}
  PHAROS_EMBEDDING_SIMILARITY: ${PHAROS_EMBEDDING_SIMILARITY:-0.92}
  PHAROS_EMBEDDING_WINDOW_DAYS: ${PHAROS_EMBEDDING_WINDOW_DAYS:-14}
  PHAROS_EMBEDDING_BATCH: ${PHAROS_EMBEDDING_BATCH:-50}
  PHAROS_EMBEDDING_CALLS_PER_MINUTE: ${PHAROS_EMBEDDING_CALLS_PER_MINUTE:-120}
  PHAROS_EMBEDDING_PRICE_MICRO_USD: ${PHAROS_EMBEDDING_PRICE_MICRO_USD:-1}
  PHAROS_DEFAULT_LOCALE: ${PHAROS_DEFAULT_LOCALE:-en}

# What the API gets: the above plus everything about signing in.
x-backend-env: &backend-env
  <<: *worker-env
  PHAROS_PROCESS: api
  PHAROS_DATABASE_URL: postgresql+asyncpg://pharos_app:${PHAROS_APP_PASSWORD:?set PHAROS_APP_PASSWORD}@postgres:5432/pharos
  PHAROS_REDIS_URL: redis://pharos_api:${PHAROS_REDIS_PASSWORD:?set PHAROS_REDIS_PASSWORD}@redis:6379/0
  PHAROS_SECRET_KEY: ${PHAROS_SECRET_KEY:?set PHAROS_SECRET_KEY}
  PHAROS_LOCAL_LOGIN: ${PHAROS_LOCAL_LOGIN:-break-glass}
  # Single sign-on is off while PHAROS_OIDC_ISSUER and PHAROS_OIDC_CLIENT_ID are empty. With
  # PHAROS_OIDC_PRESET=entra the tenant id replaces the issuer, and a missing tenant or client id
  # stops the API from starting (it never falls back to a wider setting).
  PHAROS_OIDC_PRESET: ${PHAROS_OIDC_PRESET:-generic}
  PHAROS_ENTRA_TENANT_ID: ${PHAROS_ENTRA_TENANT_ID:-}
  PHAROS_ENTRA_ALLOW_GUESTS: ${PHAROS_ENTRA_ALLOW_GUESTS:-false}
  PHAROS_OIDC_ISSUER: ${PHAROS_OIDC_ISSUER:-}
  PHAROS_OIDC_CLIENT_ID: ${PHAROS_OIDC_CLIENT_ID:-}
  PHAROS_OIDC_CLIENT_SECRET: ${PHAROS_OIDC_CLIENT_SECRET:-}
  PHAROS_OIDC_SCOPES: ${PHAROS_OIDC_SCOPES:-openid profile email}
  PHAROS_OIDC_PROVIDER_NAME: ${PHAROS_OIDC_PROVIDER_NAME:-Single sign-on}
  PHAROS_OIDC_DEPARTMENT_CLAIM: ${PHAROS_OIDC_DEPARTMENT_CLAIM:-department}
  # Retention (ADR-0025): the defaults of the operator commands, not an automatic job.
  PHAROS_AUDIT_RETENTION_DAYS: ${PHAROS_AUDIT_RETENTION_DAYS:-365}
  PHAROS_INTERACTIONS_RETENTION_MONTHS: ${PHAROS_INTERACTIONS_RETENTION_MONTHS:-12}

services:
  caddy:
    image: caddy:2-alpine
    <<: *hardening
    # Root inside the container with every capability dropped except the one needed to bind 80/443.
    cap_add: [NET_BIND_SERVICE]
    # The container listens on the same port numbers as the host (see the Caddyfile).
    ports:
      - "${PHAROS_HTTP_PORT:-80}:${PHAROS_HTTP_PORT:-80}"
      - "${PHAROS_HTTPS_PORT:-443}:${PHAROS_HTTPS_PORT:-443}"
    environment:
      PHAROS_DOMAIN: ${PHAROS_DOMAIN:-localhost}
      PHAROS_TLS: ${PHAROS_TLS:-internal}
      PHAROS_HSTS_MAX_AGE: ${PHAROS_HSTS_MAX_AGE:-31536000}
      PHAROS_HTTP_PORT: ${PHAROS_HTTP_PORT:-80}
      PHAROS_HTTPS_PORT: ${PHAROS_HTTPS_PORT:-443}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs: [/tmp]
    networks:
      edge: {}
      app:
        ipv4_address: ${PHAROS_CADDY_IP:-172.28.20.254}
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2020/"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 128m

  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    image: pharos-web:${PHAROS_IMAGE_TAG:-local}
    <<: *hardening
    environment:
      PHAROS_DEFAULT_LOCALE: ${PHAROS_DEFAULT_LOCALE:-en}
    tmpfs: [/tmp, /app/.next/cache]
    networks: [app]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 512m

  api:
    build: *backend-build
    image: pharos-backend:${PHAROS_IMAGE_TAG:-local}
    <<: *hardening
    # X-Forwarded-For and friends are honoured only from Caddy. The web container can reach this port
    # too, so trusting the whole network ("*") would let it, or anything that takes it over, choose
    # the client address that rate limits and the audit log record.
    command:
      - uvicorn
      - --factory
      - pharos.main:create_app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - ${PHAROS_CADDY_IP:-172.28.20.254}
    environment: *backend-env
    tmpfs: [/tmp]
    networks: [app, data, egress]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/healthz', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 512m

  worker:
    build: *backend-build
    image: pharos-backend:${PHAROS_IMAGE_TAG:-local}
    <<: *hardening
    command: ["celery", "--app", "pharos.workers.entrypoint", "worker", "--loglevel", "INFO", "--concurrency", "2"]
    # Only the process that fetches gets the GitHub token: not the scheduler and not the API.
    environment:
      <<: *worker-env
      PHAROS_GITHUB_TOKEN: ${PHAROS_GITHUB_TOKEN:-}
      # Likewise the model key: only the process that calls a model holds it.
      PHAROS_LLM_API_KEY: ${PHAROS_LLM_API_KEY:-}
    tmpfs: [/tmp]
    # `llm` is empty unless the "local-llm" profile runs the model server on it.
    networks: [data, egress, llm]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "celery --app pharos.workers.entrypoint inspect ping --timeout 5 -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 512m

  # Gives the model volume to the user the model services run as (a new volume belongs to root).
  # It runs for a moment, has no network at all and keeps the one capability that chown needs.
  ollama-init:
    profiles: ["local-llm", "local-llm-pull"]
    image: ollama/ollama:0.40.15@sha256:0e59999e0e8f9fd4e704bd788a89b7e4cad399367fb1365f8c102ac662288761
    <<: *hardening
    restart: "no"
    user: "0:0"
    cap_add: [CHOWN]
    network_mode: none
    # The server mounts the volume read-only, so the folders it expects must exist before it starts.
    entrypoint: ["/bin/sh", "-c", "mkdir -p /models/blobs /models/manifests /models/manifests-v2 && chown 10001:10001 /models /models/blobs /models/manifests /models/manifests-v2"]
    volumes: [ollama_models:/models]
    mem_limit: 64m

  # The local model server (profile "local-llm", ADR-0020). Started only with
  #   docker compose --profile local-llm up -d
  # It runs on the internal `llm` network, so it has no route to the internet and publishes no port;
  # the worker is the only service on that network besides it. Models are not downloaded by this
  # service: an operator puts them in the volume with scripts/ollama-pull.sh (see `ollama-pull`).
  ollama:
    profiles: ["local-llm"]
    image: ollama/ollama:0.40.15@sha256:0e59999e0e8f9fd4e704bd788a89b7e4cad399367fb1365f8c102ac662288761
    <<: *hardening
    user: "10001:10001"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models
      HOME: /tmp
      OLLAMA_NOPRUNE: "1"
      # No attempt to reach Ollama's cloud service: there is no route, and none is wanted.
      OLLAMA_NO_CLOUD: "1"
      # One model at a time and one request at a time: memory and processor are bounded.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    # The server only reads the models; putting them in is the job of `ollama-pull`. A compromised
    # worker could otherwise write to the unauthenticated API of the server and change the volume.
    volumes: [ollama_models:/models:ro]
    tmpfs: [/tmp]
    networks:
      llm:
        ipv4_address: ${PHAROS_OLLAMA_IP:-172.28.30.10}
    cpus: ${PHAROS_OLLAMA_CPUS:-2}
    depends_on:
      ollama-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # A model needs memory; raise it for a larger one.
    mem_limit: ${PHAROS_OLLAMA_MEMORY:-6g}

  # One-shot download of a model into the volume, run by an operator with scripts/ollama-pull.sh.
  # It is the only part of the local-model setup with a route to the internet, and only while it
  # runs; the server above never has one.
  ollama-pull:
    profiles: ["local-llm-pull"]
    image: ollama/ollama:0.40.15@sha256:0e59999e0e8f9fd4e704bd788a89b7e4cad399367fb1365f8c102ac662288761
    <<: *hardening
    user: "10001:10001"
    restart: "no"
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_MODELS: /models
      HOME: /tmp
      MODEL: ${PHAROS_OLLAMA_PULL_MODEL:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'ollama serve >/dev/null 2>&1 & for _ in $$(seq 1 60); do ollama list >/dev/null 2>&1 && break; sleep 1; done; exec ollama pull "$$MODEL"'
    volumes: [ollama_models:/models]
    tmpfs: [/tmp]
    networks: [pull]
    depends_on:
      ollama-init: { condition: service_completed_successfully }
    mem_limit: 2g

  beat:
    build: *backend-build
    image: pharos-backend:${PHAROS_IMAGE_TAG:-local}
    <<: *hardening
    # The schedule file goes to tmpfs; it is rebuilt from the code on every start.
    command: ["celery", "--app", "pharos.workers.entrypoint", "beat", "--loglevel", "INFO", "-s", "/tmp/celerybeat-schedule", "--pidfile="]
    environment: *worker-env
    tmpfs: [/tmp]
    # The scheduler only talks to Redis, so it has no route to the internet.
    networks: [data]
    depends_on:
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    mem_limit: 256m

  # One-shot job. With PHAROS_MIGRATE_ON_START=true (the demo default) it applies the migrations
  # before the API starts. In production set it to false and run the migration yourself after
  # reviewing it: docker compose run --rm migrate
  migrate:
    build: *backend-build
    image: pharos-backend:${PHAROS_IMAGE_TAG:-local}
    <<: *hardening
    restart: "no"
    command:
      - sh
      - -c
      - 'if [ "$$PHAROS_MIGRATE_ON_START" = "true" ]; then exec alembic -c backend/alembic.ini upgrade head; else echo "PHAROS_MIGRATE_ON_START is not true: migrations skipped"; fi'
    environment:
      PHAROS_MIGRATE_ON_START: ${PHAROS_MIGRATE_ON_START:-true}
      PHAROS_MIGRATIONS_DATABASE_URL: postgresql+asyncpg://pharos_owner:${PHAROS_OWNER_PASSWORD:?set PHAROS_OWNER_PASSWORD}@postgres:5432/pharos
    tmpfs: [/tmp]
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 512m

  # Operator tasks that need the table owner (ADR-0025): delete one person, prune the audit log,
  # fold old interactions into monthly counts. It is never started by `up` (the profile), has no
  # port and no route out, and holds the owner's password only while one
  # command runs: `docker compose --profile operator run --rm operator python -m pharos.cli ...`.
  # Nothing else (not the API, the worker or the scheduler) can delete what it deletes.
  operator:
    build: *backend-build
    image: pharos-backend:${PHAROS_IMAGE_TAG:-local}
    <<: *hardening
    restart: "no"
    profiles: [operator]
    command: ["python", "-m", "pharos.cli", "--help"]
    # Its own, narrow environment (OperatorSettings): the owner's address, the organization, the
    # API's Redis user (to end sessions) and the retention defaults. Not the root key, the identity
    # provider's secret, the application's database password or a model key.
    environment:
      PHAROS_ENVIRONMENT: ${PHAROS_ENVIRONMENT:-production}
      PHAROS_LOG_LEVEL: ${PHAROS_LOG_LEVEL:-INFO}
      PHAROS_ORG_SLUG: ${PHAROS_ORG_SLUG:-default}
      PHAROS_MIGRATIONS_DATABASE_URL: postgresql+asyncpg://pharos_owner:${PHAROS_OWNER_PASSWORD:?set PHAROS_OWNER_PASSWORD}@postgres:5432/pharos
      PHAROS_REDIS_URL: redis://pharos_api:${PHAROS_REDIS_PASSWORD:?set PHAROS_REDIS_PASSWORD}@redis:6379/0
      PHAROS_AUDIT_RETENTION_DAYS: ${PHAROS_AUDIT_RETENTION_DAYS:-365}
      PHAROS_INTERACTIONS_RETENTION_MONTHS: ${PHAROS_INTERACTIONS_RETENTION_MONTHS:-12}
    tmpfs: [/tmp]
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 512m

  postgres:
    image: pgvector/pgvector:pg16
    <<: *hardening
    user: postgres
    environment:
      POSTGRES_DB: pharos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PHAROS_OWNER_PASSWORD: ${PHAROS_OWNER_PASSWORD:?set PHAROS_OWNER_PASSWORD}
      PHAROS_APP_PASSWORD: ${PHAROS_APP_PASSWORD:?set PHAROS_APP_PASSWORD}
      PHAROS_WORKER_DB_PASSWORD: ${PHAROS_WORKER_DB_PASSWORD:?set PHAROS_WORKER_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    tmpfs: [/tmp, /var/run/postgresql]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pharos"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g

  redis:
    image: redis:8.10.0-alpine
    <<: *hardening
    user: redis
    command: ["sh", "/redis/start.sh"]
    environment:
      REDIS_API_PASSWORD: ${PHAROS_REDIS_PASSWORD:?set PHAROS_REDIS_PASSWORD}
      REDIS_WORKER_PASSWORD: ${PHAROS_REDIS_WORKER_PASSWORD:?set PHAROS_REDIS_WORKER_PASSWORD}
      # Lets redis-cli authenticate in the health check without the password on its command line.
      REDISCLI_AUTH: ${PHAROS_REDIS_PASSWORD}
    volumes:
      - redis_data:/data
      - ./redis/start.sh:/redis/start.sh:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user pharos_api ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
