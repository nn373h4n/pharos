# Development identity provider for trying single sign-on without a corporate directory.
# NOT FOR PRODUCTION: fictional users with throwaway passwords, Keycloak in development mode.
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.sso-dev.yml --env-file deploy/.env up
#
# Needs in deploy/.env (besides the usual settings):
#   PHAROS_PUBLIC_URL            where users open Pharos, for example https://localhost
#   PHAROS_KEYCLOAK_PUBLIC_URL   https://auth.localhost, with :PORT if PHAROS_HTTPS_PORT is not 443
#
# Why a host name and a mounted CA: the browser and the API container must see the same issuer URL.
# Caddy serves Keycloak on auth.localhost (browsers resolve *.localhost to this machine) and the
# same name is an alias of the Caddy container on the app network, so the API reaches it too. The
# API trusts the certificate because it is given Caddy's own root certificate.

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: ${PHAROS_KEYCLOAK_PUBLIC_URL:?set PHAROS_KEYCLOAK_PUBLIC_URL}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: dev-only-admin-password
      # Replaced inside the imported realm file (client redirect URIs).
      PHAROS_PUBLIC_URL: ${PHAROS_PUBLIC_URL:?set PHAROS_PUBLIC_URL}
    volumes:
      - ./keycloak/pharos-realm.json:/opt/keycloak/data/import/pharos-realm.json:ro
    networks: [app]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    mem_limit: 1200m

  caddy:
    volumes:
      - ./caddy/sso-dev.caddy:/etc/caddy/conf.d/sso-dev.caddy:ro
    networks:
      app:
        aliases: [auth.localhost]

  # Copies Caddy's PUBLIC root certificate into a volume of its own. The caddy_data volume also
  # holds the CA's private keys (readable by root only) and must never be mounted into another
  # service. Runs once, waits for Caddy to create the certificate, then exits.
  dev-ca-export:
    image: caddy:2-alpine
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    command:
      - sh
      - -c
      - >-
        until [ -f /data/caddy/pki/authorities/local/root.crt ]; do sleep 1; done;
        cp /data/caddy/pki/authorities/local/root.crt /public/root.crt &&
        chmod 644 /public/root.crt
    volumes:
      - caddy_data:/data:ro
      - dev_ca_public:/public
    depends_on:
      caddy: { condition: service_healthy }

  api:
    environment:
      # httpx (and Python's ssl module) trust this file instead of the system certificates, which is
      # enough for the development identity provider.
      SSL_CERT_FILE: /dev-ca/root.crt
    volumes:
      - dev_ca_public:/dev-ca:ro

volumes:
  dev_ca_public: {}
