name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # New vulnerabilities are published every day, so scan even when nothing changed.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tools run as pinned Docker images instead of third-party actions.
  GITLEAKS_IMAGE: zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
  TRIVY_IMAGE: aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c # 0.76.1

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the whole git history
        run: |
          docker run --rm \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            -v "$GITHUB_WORKSPACE:/repo:ro" "$GITLEAKS_IMAGE" git --redact --verbose /repo

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  trivy-filesystem:
    name: Trivy (dependencies, secrets, configuration)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Lockfiles (uv.lock, pnpm-lock.yaml), Dockerfiles and the Compose file.
      - name: Scan the repository
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -v trivy-cache:/root/.cache "$TRIVY_IMAGE" fs \
            --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /repo

  trivy-images:
    name: Trivy (images)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the images
        run: |
          docker build -f backend/Dockerfile -t pharos-backend:scan .
          docker build -f frontend/Dockerfile -t pharos-web:scan .
          mkdir -p "$RUNNER_TEMP/images"
          docker save pharos-backend:scan -o "$RUNNER_TEMP/images/backend.tar"
          docker save pharos-web:scan -o "$RUNNER_TEMP/images/web.tar"
      - name: Scan the images
        run: |
          for image in backend web; do
            echo "== $image"
            docker run --rm -v "$RUNNER_TEMP/images:/images:ro" -v trivy-cache:/root/.cache "$TRIVY_IMAGE" image \
              --input "/images/$image.tar" --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          done

  trivy-upstream-images:
    # The images we do not build (proxy, database, cache) change independently of our code, so they
    # are checked on a schedule and on demand, not on every pull request.
    name: Trivy (upstream images)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan caddy, postgres and redis
        run: |
          for service in caddy postgres redis; do
            image=$(scripts/compose-image.sh "$service")
            echo "== $image"
            docker pull -q "$image"
            docker save "$image" -o "$RUNNER_TEMP/image.tar"
            docker run --rm -v "$RUNNER_TEMP:/images:ro" -v trivy-cache:/root/.cache "$TRIVY_IMAGE" image \
              --input /images/image.tar --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          done
