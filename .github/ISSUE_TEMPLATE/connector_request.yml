name: Connector request
description: Propose a new content source
labels: ["connector"]
body:
  - type: input
    id: source
    attributes:
      label: Source name and URL
    validations:
      required: true
  - type: textarea
    id: access
    attributes:
      label: How content is accessed
      description: Public API, RSS or Atom feed, scraping, authentication needed, rate limits and pagination.
    validations:
      required: true
  - type: textarea
    id: terms
    attributes:
      label: Terms of service and robots.txt
      description: Link the terms. Say what they allow for automated access and for storing excerpts. Sources with paid or restricted APIs stay off by default.
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: What would be stored
      description: Pharos stores a title, a short excerpt and the link to the original, not full text.
    validations:
      required: true
  - type: checkboxes
    id: willing
    attributes:
      label: Contribution
      options:
        - label: I can implement this connector with tests
