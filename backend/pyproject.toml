[project]
name = "pharos"
version = "0.0.0"
description = "Pharos backend: API and worker"
readme = "../README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "celery>=5.6.3",
    "fastapi>=0.162.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["pharos"]

# Celery ships no type information; the rest of the code base stays strictly typed.
[[tool.mypy.overrides]]
module = ["celery", "celery.*", "kombu", "kombu.*"]
ignore_missing_imports = true

# Celery's decorators are untyped, so decorated tasks and signal handlers cannot be typed either.
[[tool.mypy.overrides]]
module = ["pharos.workers.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration' --strict-markers"
markers = ["integration: needs PostgreSQL and Redis (run with make test-integration)"]
filterwarnings = ["error"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
